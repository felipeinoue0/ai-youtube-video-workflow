version: 2

# target-branch: "dev" is load-bearing. Without it, Dependabot opens PRs
# against the default branch (`main`) and bypasses the `dev` integration
# branch -- dependency bumps would land straight on the release branch.
# See AGENTS.md -> Git Workflow.

updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
