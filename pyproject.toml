[project]
name = "ytflow"
version = "0.1.0"
description = "Agent skills and a CLI that guide a creator from channel branding to a published YouTube video."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ytflow = "ytflow.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
